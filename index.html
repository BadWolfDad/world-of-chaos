<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>World of Chaos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101820; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #title {
      position: fixed; top: 12px; left: 0; right: 0; text-align: center;
      color: #ffcf33; font-family: Arial, sans-serif; font-weight: bold;
      font-size: 30px; letter-spacing: 2px; pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    #hint {
      position: fixed; bottom: 16px; left: 0; right: 0;
      text-align: center; color: #fff; font-family: Arial, sans-serif;
      font-size: 20px; pointer-events: none; opacity: 0.85;
    }
    #tank {
      position: fixed; top: 14px; right: 16px; color: #fff;
      font-family: Arial, sans-serif; font-size: 20px; opacity: 0.9; pointer-events: none;
    }
    #controls {
      position: fixed; top: 50px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    }
    .btn {
      font-size: 11px; padding: 6px 11px; border: none; border-radius: 8px;
      background: #33475b; color: #fff; font-family: Arial, sans-serif; font-weight: bold;
      cursor: pointer; box-shadow: 0 2px 0 #1b2836;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b2836; }
    .btn.active { background: #2ed573; color: #06331b; box-shadow: 0 2px 0 #1e9e52; }
    #rotctl { position: fixed; bottom: 20px; right: 16px; display: none; gap: 12px; z-index: 5; }
    .rbtn {
      width: 62px; height: 62px; border-radius: 50%; border: none;
      background: rgba(51,71,91,0.85); color: #fff; font-size: 30px; font-weight: bold;
      cursor: pointer; touch-action: none; box-shadow: 0 3px 0 #1b2836;
    }
    .rbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b2836; }
    #quests { position: fixed; top: 88px; left: 10px; color: #fff; font-family: Arial, sans-serif; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.7); max-width: 62vw; line-height: 1.5; }
    #quests .qtitle { font-weight: bold; font-size: 18px; color: #ffcf33; margin-bottom: 3px; }
    #quests .qdone { color: #2ed573; }
    #quests .qp { opacity: 0.65; font-size: 12px; }
    #levelbanner { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(0,0,0,0.55); z-index: 10; }
    #bannertext { color: #ffcf33; font-family: Arial, sans-serif; font-weight: bold; font-size: 40px; text-shadow: 0 2px 8px #000; text-align: center; }
    #nextLevelBtn { font-size: 24px; padding: 14px 32px; border: none; border-radius: 14px; background: #2ed573; color: #06331b; font-family: Arial, sans-serif; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #1e9e52; }
    #soundpanel { position: fixed; top: 92px; right: 12px; display: none; flex-direction: column; gap: 10px; background: rgba(20,28,38,0.96); padding: 14px; border-radius: 12px; z-index: 8; color: #fff; font-family: Arial, sans-serif; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    #soundpanel .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #soundpanel input[type=range] { width: 120px; }
    @media (max-width: 820px) {
      #title { font-size: 22px; }
      #hint { font-size: 13px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="title">🌪️ WORLD OF CHAOS 🌪️</div>
  <div id="hint">Tap to use &nbsp;•&nbsp; hold for the tool menu &nbsp;•&nbsp; two fingers = beam / aim</div>
  <canvas id="game"></canvas>
  <div id="tank">🛢️ Tank: 0</div>
  <div id="controls">
    <button id="boomBtn" class="btn active">💥 BOOM</button>
    <button id="grabBtn" class="btn">✋ GRAB</button>
    <button id="goatBtn" class="btn">🐐 GOAT</button>
    <button id="daveBtn" class="btn">🟩 DAVE</button>
    <button id="anvilBtn" class="btn">⚓ ANVIL</button>
    <button id="planeBtn" class="btn">✈️ PLANE</button>
    <button id="birdBtn" class="btn">🐦 BIRD</button>
    <button id="heliBtn" class="btn">🚁 HELI</button>
    <button id="colaBtn" class="btn">🥤 COLA</button>
    <button id="comboBtn" class="btn">🔗 COMBO</button>
    <button id="soulBtn" class="btn">👻 SOUL</button>
    <button id="spongeBtn" class="btn">🧽 SPONGE</button>
    <button id="entityBtn" class="btn">⬛ ENTITY</button>
    <button id="gunBtn" class="btn">🔫 GRAV GUN</button>
    <button id="jetBtn" class="btn">🚀 JET</button>
    <button id="squareBtn" class="btn">🟦 ADD SQUARE</button>
    <button id="bucketBtn" class="btn">🪣 BUCKET</button>
    <button id="vacBtn" class="btn">🌀 VACUUM</button>
    <button id="needleBtn" class="btn">💉 NEEDLE</button>
    <button id="stickBtn" class="btn">🔗 STICK</button>
    <button id="cannibalBtn" class="btn">🩸 CANNIBALISM</button>
    <button id="takeoffBtn" class="btn">🛫 TAKEOFF</button>
    <button id="landBtn" class="btn">🛬 LAND</button>
    <button id="pauseBtn" class="btn">⏸️ PAUSE</button>
    <button id="soundBtn" class="btn">🔊 SOUND</button>
  </div>
  <div id="soundpanel">
    <div class="srow"><span>🔊 Master</span><input id="masterSlider" type="range" min="0" max="100" value="100"></div>
    <div class="srow"><span>😱 Scream</span><input id="screamSlider" type="range" min="0" max="100" value="100"></div>
    <button id="muteBtn" class="btn">🔇 MUTE</button>
  </div>
  <div id="rotctl">
    <button id="rotL" class="rbtn">↺</button>
    <button id="rotR" class="rbtn">↻</button>
  </div>
  <div id="quests"></div>
  <div id="levelbanner">
    <div id="bannertext">🏆 LEVEL COMPLETE!</div>
    <button id="nextLevelBtn">NEXT LEVEL ▶</button>
  </div>

  <script>
    // ===== JAKE'S KNOBS — change these numbers and hit save! =====
    const BLOCK_COUNT = 200;      // how many blocks in the tower
    const EXPLOSION_POWER = 300;  // how hard the boom pushes
    const GRAVITY = 0.1;          // how fast things fall
    const BOUNCINESS = 0.1;       // how bouncy blocks are when they smack each other (0 = thud, 1 = super bouncy)
    const STICK_STRENGTH = 0.3;   // how strong the glue is (0 = loose, 1 = rock solid)
    const BREAK_DISTANCE = 90;    // how far a bond can stretch before it SNAPS (bigger = harder to break)
    const BOOM_VOLUME = 0.6;      // how loud the boom is (0 = silent, 1 = full blast)
    const POP_VOLUME = 0.5;       // how loud the little block-hit pops are
    const POP_THRESHOLD = 2.5;    // how HARD blocks must smack to make a pop (higher = only big hits)
    const SCREAMSPEED = 15;       // how fast a block must fly before it starts SCREAMING (higher = only crazy-fast)
    const SCREAMPITCH = 800;      // how high the scream is (bigger number = higher, screechier)
    const COLA_STICK_MAX = 4;     // how many things each sticky cola ball can grab at once
    const VACUUM_POWER = 1;       // how hard the vacuum sucks things toward the nozzle
    const VACUUM_RANGE = 260;     // how close things must be before the vacuum grabs them
    const VACUUM_SWIRL = 1.2;     // how much sucked-up stuff swirls around as it goes in
    const ENTITY_SPEED = 2;       // how fast the entity walks around hunting
    // =============================================================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const stickBtn = document.getElementById("stickBtn");
    const boomBtn = document.getElementById("boomBtn");
    const grabBtn = document.getElementById("grabBtn");
    const goatBtn = document.getElementById("goatBtn");
    const daveBtn = document.getElementById("daveBtn");
    const anvilBtn = document.getElementById("anvilBtn");
    const planeBtn = document.getElementById("planeBtn");
    const birdBtn = document.getElementById("birdBtn");
    const heliBtn = document.getElementById("heliBtn");
    const colaBtn = document.getElementById("colaBtn");
    const comboBtn = document.getElementById("comboBtn");
    const soulBtn = document.getElementById("soulBtn");
    const spongeBtn = document.getElementById("spongeBtn");
    const entityBtn = document.getElementById("entityBtn");
    const gunBtn = document.getElementById("gunBtn");
    const jetBtn = document.getElementById("jetBtn");
    const squareBtn = document.getElementById("squareBtn");
    const bucketBtn = document.getElementById("bucketBtn");
    const vacBtn = document.getElementById("vacBtn");
    const needleBtn = document.getElementById("needleBtn");
    const cannibalBtn = document.getElementById("cannibalBtn");
    const takeoffBtn = document.getElementById("takeoffBtn");
    const landBtn = document.getElementById("landBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const tankEl = document.getElementById("tank");
    const tankPos = { x: 90, y: null }; // where the vacuum bag sits (you can drag it)
    let draggingTank = false;
    const tankGrab = { dx: 0, dy: 0 };
    let W, H;
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; if (tankPos.y === null) tankPos.y = H - 70; }
    resize();
    addEventListener("resize", resize);

    const colors = ["#ff4757", "#ffa502", "#feca57", "#2ed573", "#1e90ff", "#a55eea"];
    let blocks = [];
    let bonds = [];      // the springy glue connections between blocks
    let flames = [];     // little rising fire triangles
    let bits = [];       // tiny squares that burst out when a Dave egg hatches
    let sticky = false;  // are the blocks glued right now?
    let shake = 0;
    let mode = "boom";   // "boom" = click explodes, "grab" = drag a block, "spawn" = drop an object
    let held = null;     // the block you're currently holding
    let spawnKind = "goat"; // which object the spawn tool drops
    let pointerDown = false; // is the LEFT mouse button held down right now?
    let rightDown = false;   // is the RIGHT mouse button held down right now?
    const tankColors = {};    // colors stored in the tank, like { "#ff4757": 3 }
    let selectedColorIdx = 0; // which color the needle is loaded with (pick with number keys)
    const INJECT_ORDER = ["#ff4757", "#ffa502", "#feca57", "#2ed573", "#1e90ff", "#a55eea", "#7f8c8d", "#5a3a1a"];
    const WATER_COLOR = "#3aa0ff"; // the blue that water paints things
    const LAVA_COLOR = "#ff4757";  // the red that lava paints things
    const LAVA_DROP_COLORS = ["#ffa502", "#feca57", "#ff4757"]; // orange / yellow / red lava blobs
    let bucketLiquid = "water";    // what the bucket pours: "water" or "lava"
    let cannibalism = false;       // can entities eat each other?
    let paused = false;            // freeze the whole game
    let level = 0, levelComplete = false, quests = [];
    const stats = { booms: 0, destroyed: 0, stone: 0, fires: 0, eaten: 0, colaPops: 0, vacuumed: 0, defeated: 0 };
    const mouse = { x: 0, y: 0 };

    // ===== SOUND — built out of pure math, no files needed =====
    let audioCtx;
    let masterGain = null, masterVolume = 1, screamVol = 1; // sound settings
    function getAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = masterVolume;
        masterGain.connect(audioCtx.destination); // everything routes through here
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function playBoom() {
      const ac = getAudio();
      const now = ac.currentTime;
      const dur = 0.4;
      const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1; // static/noise = the boom body
      const noise = ac.createBufferSource();
      noise.buffer = buffer;
      const filter = ac.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(900, now);
      filter.frequency.exponentialRampToValueAtTime(60, now + dur); // sweep down = that deep WHOOMP
      const gain = ac.createGain();
      gain.gain.setValueAtTime(BOOM_VOLUME, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
      noise.start(now); noise.stop(now + dur);
    }
    function playSnap() {
      const ac = getAudio();
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(1100, now);
      osc.frequency.exponentialRampToValueAtTime(250, now + 0.08); // quick chirp = the glue cracking
      const gain = ac.createGain();
      gain.gain.setValueAtTime(BOOM_VOLUME * 0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + 0.08);
    }
    const MAX_POPS = 5; // most pops we'll allow in one frame, so pileups don't blast your ears
    function playPop(strength) {
      const ac = getAudio();
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      osc.type = "triangle";
      const freq = 300 + Math.random() * 500; // random pitch so every pop sounds a little different
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.06);
      const gain = ac.createGain();
      const vol = Math.min(1, strength / 12) * POP_VOLUME * 0.4; // harder hit = louder pop
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + 0.06);
    }
    // one long scream voice that rises when blocks fly fast and hushes when they settle
    let screamOsc = null, screamGain = null;
    function updateScream(maxSpeed) {
      if (!audioCtx) return; // no sound until you've clicked at least once
      if (!screamOsc) {
        screamOsc = audioCtx.createOscillator();
        screamOsc.type = "sawtooth";
        screamGain = audioCtx.createGain();
        screamGain.gain.value = 0;
        screamOsc.connect(screamGain); screamGain.connect(masterGain);
        screamOsc.start();
      }
      const now = audioCtx.currentTime;
      if (maxSpeed > SCREAMSPEED) {
        const pitch = SCREAMPITCH + (maxSpeed - SCREAMSPEED) * 15; // faster = higher scream
        screamOsc.frequency.setTargetAtTime(pitch, now, 0.02);
        screamGain.gain.setTargetAtTime(0.18 * BOOM_VOLUME * screamVol, now, 0.02);
      } else {
        screamGain.gain.setTargetAtTime(0, now, 0.05); // quiet again when things slow down
      }
    }
    function playWin() { // little rising jingle when a level is beaten
      const ac = getAudio(), now = ac.currentTime;
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = f;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, now + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.25 * BOOM_VOLUME, now + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.25);
        o.connect(g); g.connect(masterGain); o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.26);
      });
    }
    function playBleat() { // a goat "maaah" — random length between 0.5s and 2s
      const ac = getAudio(), now = ac.currentTime;
      const dur = 0.5 + Math.random() * 1.5;
      const base = 180 + Math.random() * 340; // random pitch each bleat — low (deep) to high (squeaky)
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(base, now);
      o.frequency.linearRampToValueAtTime(base * 0.85, now + dur);
      const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 22;
      const lfoGain = ac.createGain(); lfoGain.gain.value = 35;
      lfo.connect(lfoGain); lfoGain.connect(o.frequency); // vibrato = the bleaty wobble
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.12 * BOOM_VOLUME, now + 0.03);
      g.gain.setValueAtTime(0.12 * BOOM_VOLUME, now + Math.max(0.05, dur - 0.08)); // hold the note
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + dur + 0.02); lfo.start(now); lfo.stop(now + dur + 0.02);
    }
    function playChirp() { // a quick bird chirp
      const ac = getAudio(), now = ac.currentTime;
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(2600, now);
      o.frequency.exponentialRampToValueAtTime(3900, now + 0.05);
      o.frequency.exponentialRampToValueAtTime(2400, now + 0.12);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.1 * BOOM_VOLUME, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.14);
    }
    let jetNodes = null;
    function updateJetDrone(active) { // a steady jet-engine hum while flying planes exist
      if (!audioCtx) return;
      if (!jetNodes) {
        const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
        const o1 = audioCtx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = 68;
        const o2 = audioCtx.createOscillator(); o2.type = "sawtooth"; o2.frequency.value = 225;
        const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 750;
        o1.connect(f); o2.connect(f); f.connect(g);
        o1.start(); o2.start();
        jetNodes = { g };
      }
      jetNodes.g.gain.setTargetAtTime(active ? 0.05 * BOOM_VOLUME : 0, audioCtx.currentTime, 0.1);
    }
    let goatScreamNodes = null;
    function updateGoatScream(active) { // a medium-pitched scream while a goat is charging
      if (!audioCtx) return;
      if (!goatScreamNodes) {
        const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
        const o = audioCtx.createOscillator(); o.type = "sawtooth"; o.frequency.value = 560;
        const lfo = audioCtx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 14;
        const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 45;
        lfo.connect(lfoGain); lfoGain.connect(o.frequency);
        o.connect(g); o.start(); lfo.start();
        goatScreamNodes = { g };
      }
      goatScreamNodes.g.gain.setTargetAtTime(active ? 0.13 * BOOM_VOLUME : 0, audioCtx.currentTime, 0.02);
    }
    let heliNodes = null;
    function updateHeliSound(active) { // a "whop whop whop" chopper sound while helicopters exist
      if (!audioCtx) return;
      if (!heliNodes) {
        const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
        const o = audioCtx.createOscillator(); o.type = "sawtooth"; o.frequency.value = 120;
        const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
        o.connect(f); f.connect(g);
        const chop = audioCtx.createOscillator(); chop.type = "square"; chop.frequency.value = 9; // rotor chop
        const chopGain = audioCtx.createGain(); chopGain.gain.value = 0;
        chop.connect(chopGain); chopGain.connect(g.gain);
        o.start(); chop.start();
        heliNodes = { g, chopGain };
      }
      heliNodes.g.gain.setTargetAtTime(active ? 0.06 * BOOM_VOLUME : 0, audioCtx.currentTime, 0.05);
      heliNodes.chopGain.gain.setTargetAtTime(active ? 0.05 * BOOM_VOLUME : 0, audioCtx.currentTime, 0.05);
    }
    let alarmNodes = null;
    function updateFuelAlarm(active) { // "woop woop" terrain-alarm while an aircraft burns fuel
      if (!audioCtx) return;
      if (!alarmNodes) {
        const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
        const o = audioCtx.createOscillator(); o.type = "sine"; o.frequency.value = 500;
        const lfo = audioCtx.createOscillator(); lfo.type = "sawtooth"; lfo.frequency.value = 2.2; // ~2 woops/sec
        const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 320; // pitch sweep depth
        lfo.connect(lfoGain); lfoGain.connect(o.frequency);
        o.connect(g); o.start(); lfo.start();
        alarmNodes = { g };
      }
      alarmNodes.g.gain.setTargetAtTime(active ? 0.08 * BOOM_VOLUME : 0, audioCtx.currentTime, 0.05);
    }
    // ===========================================================

    function buildTower() {
      blocks = [];
      bonds = [];
      flames = [];
      bits = [];
      sticky = false;
      held = null;
      stickBtn.textContent = "🔗 STICK";
      const size = 40;
      const cols = 5;
      for (let i = 0; i < BLOCK_COUNT; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        blocks.push({
          x: W / 2 - (cols * size) / 2 + col * size,
          y: H - 60 - row * size,
          w: size - 4,
          h: size - 4,
          vx: 0, vy: 0,
          angle: 0, spin: 0,
          color: colors[i % colors.length],
          mass: 1, kind: "block", emoji: null,
        });
      }
    }
    buildTower();

    // ADD SQUARE (hold the button): reset the map to a fresh tower, but keep the surviving entities
    function resetKeepSurvivors() {
      const survivors = blocks.filter(b => b.kind === "entity" && !b.dead);
      buildTower(); // clears everything and builds a fresh tower
      for (const e of survivors) { e.eating = []; blocks.push(e); } // drop the survivors back in
    }
    // ADD SQUARE (right-click the button): keep what's there, dump in a fresh batch of squares
    function addSquares(n) {
      const size = 36;
      for (let i = 0; i < n; i++) {
        blocks.push({
          x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H / 2),
          w: size, h: size, vx: 0, vy: 0, angle: 0, spin: 0,
          color: colors[Math.floor(Math.random() * colors.length)],
          mass: 1, kind: "block", emoji: null,
        });
      }
    }

    // ===== QUESTS & LEVELS — each level rolls 1 to 3 random goals =====
    const QUESTS = [
      { key: "booms",     label: n => `💥 Boom ${n} times`,        min: 3,  max: 8 },
      { key: "destroyed", label: n => `🧹 Clear ${n} blocks`,       min: 15, max: 50 },
      { key: "stone",     label: n => `🪨 Make ${n} stone blocks`,  min: 3,  max: 8 },
      { key: "fires",     label: n => `🔥 Set ${n} things on fire`, min: 5,  max: 15 },
      { key: "eaten",     label: n => `⬛ Feed the entity ${n}`,     min: 4,  max: 10, entity: true },
      { key: "colaPops",  label: n => `🥤 Pop ${n} cola cans`,      min: 1,  max: 3 },
      { key: "vacuumed",  label: n => `🌀 Vacuum up ${n} things`,   min: 8,  max: 20 },
      { key: "defeated",  label: n => `🏆 Defeat ${n} entity`,      min: 1,  max: 2, entity: true },
    ];
    function newLevel() {
      level++;
      buildTower();
      const n = 1 + Math.floor(Math.random() * 3); // 1 to 3 quests
      const pool = QUESTS.slice();
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      quests = pool.slice(0, n).map(q => {
        const target = q.min + Math.floor(Math.random() * (q.max - q.min + 1));
        return { key: q.key, target, label: q.label(target), start: stats[q.key], done: false };
      });
      if (quests.some(q => q.entity)) { addObject(W * 0.3, 90, "entity"); addObject(W * 0.7, 90, "entity"); } // give them entities to work with
      levelComplete = false;
      document.getElementById("levelbanner").style.display = "none";
    }
    function updateQuests() {
      if (!quests.length) return;
      let allDone = true, html = `<div class="qtitle">LEVEL ${level}</div>`;
      for (const q of quests) {
        const prog = Math.min(q.target, stats[q.key] - q.start);
        q.done = prog >= q.target;
        if (!q.done) allDone = false;
        html += `<div class="${q.done ? 'qdone' : 'q'}">${q.done ? '☑' : '☐'} ${q.label} <span class="qp">${prog}/${q.target}</span></div>`;
      }
      const el = document.getElementById("quests");
      if (el.innerHTML !== html) el.innerHTML = html;
      if (allDone && !levelComplete) {
        levelComplete = true;
        document.getElementById("bannertext").textContent = "🏆 LEVEL " + level + " COMPLETE!";
        document.getElementById("levelbanner").style.display = "flex";
        playWin();
      }
    }
    document.getElementById("nextLevelBtn").addEventListener("click", newLevel);

    // drop a new object (a goat, an anvil, or a plain block) into the world
    function addObject(x, y, kind) {
      let w = 40, h = 40, mass = 1, emoji = null;
      if (kind === "goat")  { w = 46; h = 46; mass = 2; emoji = "🐐"; }
      if (kind === "dave")  { w = 40; h = 52; mass = 1.2; } // starts as an egg; hatches into a SMALL Dave that eats squares to grow
      if (kind === "anvil") { w = 52; h = 44; mass = 8; }        // anvil = super heavy
      if (kind === "plane") { w = 60; h = 60; mass = 1.5; emoji = "✈️"; }
      if (kind === "helicopter") { w = 56; h = 56; mass = 1.5; emoji = "🚁"; } // like a plane; jet-combine it to fly
      if (kind === "bird") { w = 34; h = 34; mass = 0.6; emoji = "🐦"; } // flies around; blows up if a jet sucks it in
      if (kind === "combo") { w = 32; h = 32; mass = 0.8; emoji = "🔗"; } // ropes 2 things and fuses known combos
      if (kind === "flyingplane") { w = 60; h = 60; mass = 1; emoji = "✈️"; } // jet + plane = a plane that flies itself
      if (kind === "flyinghelicopter") { w = 56; h = 56; mass = 1; emoji = "🚁"; } // jet + helicopter = a flying chopper
      if (kind === "seat") { w = 30; h = 30; mass = 0.6; emoji = "💺"; }        // aircraft debris (fireproof)
      if (kind === "landinggear") { w = 30; h = 30; mass = 0.8; emoji = "🛞"; } // aircraft debris (fireproof)
      if (kind === "tire") { w = 26; h = 26; mass = 0.7; }                       // drawn tire debris
      if (kind === "propeller") { w = 44; h = 12; mass = 0.5; }                   // drawn propeller debris
      if (kind === "soul") { w = 30; h = 30; mass = 0.5; emoji = "👻"; } // combine with a goat to make a skittish jumping goat
      if (kind === "soulgoat") { w = 46; h = 46; mass = 1; emoji = "🐐"; } // hops around, flees everything but souls & goats
      if (kind === "cola")  { w = 34; h = 54; mass = 2; }        // drawn as a can; tips over and fizzes
      if (kind === "sponge") { w = 44; h = 34; mass = 1.5; emoji = "🧽"; } // soaks up liquids it touches
      if (kind === "entity") { w = 40; h = 40; mass = 2; } // black square that grows writhing limbs when touched
      if (kind === "gravgun") { w = 54; h = 26; mass = 2; } // HL2-style gravity gun you carry and fire
      if (kind === "jet") { w = 56; h = 28; mass = 2; } // jet engine: sucks blocks in and burns them into fire
      const obj = {
        x: x - w / 2, y: y - h / 2, w, h,
        vx: 0, vy: 0, angle: 0, spin: 0,
        color: colors[Math.floor(Math.random() * colors.length)], mass, emoji, kind,
      };
      if (kind === "plane") obj.vx = 10;       // planes fly in!
      if (kind === "cola") obj.popped = false; // hasn't fizzed yet
      if (kind === "entity") { obj.activated = false; obj.growTimer = 0; obj.limbs = []; obj.eating = []; }
      if (kind === "gravgun") { obj.aim = -Math.PI / 2; obj.angle = -Math.PI / 2; obj.beamHold = null; obj.beamDist = 120; }
      if (kind === "jet") { obj.aim = 0; obj.angle = 0; obj.fuel = 0; obj.boost = 0; }
      if (kind === "combo") obj.stuck = [];
      if (kind === "dave") {
        obj.dir = Math.random() < 0.5 ? -1 : 1;
        const rareDaves = ["#ff4757", "#ffd32a", "#1e90ff", "#95a5a6"]; // red, yellow, blue, grey
        obj.color = Math.random() < 0.1 ? rareDaves[Math.floor(Math.random() * rareDaves.length)] : "#2ed573";
        obj.egg = true;                                   // Dave starts as an egg...
        obj.eggT = 60 + Math.floor(Math.random() * 240);  // ...that hatches in 1-5 seconds
      }
      if (kind === "helicopter") obj.vx = 6;
      if (kind === "flyingplane") { obj.vx = 8; obj.fuel = 0; obj.flying = false; }       // parks until you press TAKEOFF
      if (kind === "flyinghelicopter") { obj.vx = 5; obj.fuel = 0; obj.flying = false; }
      if (kind === "seat" || kind === "landinggear" || kind === "tire" || kind === "propeller") obj.fireproof = true;
      blocks.push(obj);
    }

    // when a Dave egg hatches: tiny squares pop out and fall through the screen (Sonic/Mario death style)
    function spawnHatch(b) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const shapes = ["square", "triangle", "circle"];
      const n = 16 + Math.floor(Math.random() * 10);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.5;
        bits.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: -3 - Math.random() * 4, size: 4 + Math.random() * 5, color: b.color, shape: shapes[Math.floor(Math.random() * 3)], spin: (Math.random() - 0.5) * 0.4, rot: 0 });
      }
    }

    // a hatched Dave grows a quarter of the way to full size for each square he eats (4 squares = normal)
    function growDave(b) {
      const cx = b.x + b.w / 2, bottom = b.y + b.h;
      b.scale = Math.min(1, 0.5 + (b.eaten || 0) * 0.125);
      b.w = (b.baseW || 68) * b.scale;
      b.h = (b.baseH || 28) * b.scale;
      b.x = cx - b.w / 2;
      b.y = bottom - b.h;
    }

    // draw a little cartoon anvil shape (there's no anvil emoji, so we build one!)
    function drawAnvil(w, h) {
      ctx.fillStyle = "#3d4450";
      ctx.fillRect(-w / 2, -h / 2, w, h * 0.32);          // top slab
      ctx.beginPath();                                     // pointy horn on the left
      ctx.moveTo(-w / 2, -h / 2);
      ctx.lineTo(-w / 2 - w * 0.18, -h / 2 + h * 0.16);
      ctx.lineTo(-w / 2, -h / 2 + h * 0.32);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(-w * 0.16, -h / 2 + h * 0.32, w * 0.32, h * 0.36); // skinny waist
      ctx.fillRect(-w / 2, h / 2 - h * 0.3, w, h * 0.3);   // wide base
    }

    // spray brown fizz-balls out of a tipped-over cola can
    function popCola(can) {
      can.popped = true;
      stats.colaPops++;
      const count = 15 + Math.floor(Math.random() * 6); // 15 to 20 drops
      const cx = can.x + can.w / 2, cy = can.y + can.h / 2;
      for (let i = 0; i < count; i++) {
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; // spray upward-ish
        const spd = 4 + Math.random() * 5;
        blocks.push({
          x: cx - 5, y: cy - 5, w: 10, h: 10,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          angle: 0, spin: 0, color: "#5a3a1a", mass: 0.3,
          emoji: null, kind: "coladrop",
          stuck: [], // cola fizz stays until you sponge or vacuum it up
        });
      }
    }

    // a cola drop welds together everything it touches (stiff, block-to-block, stays until broken)
    function stickTo(ball, other) {
      if (other.kind === "coladrop") return;           // drops don't weld to each other
      if (ball.stuck.length >= COLA_STICK_MAX) return; // this drop is already full
      if (ball.stuck.includes(other)) return;          // already welded this one
      // stiff-weld `other` to everything this drop already grabbed — like a Garry's Mod weld
      for (const prev of ball.stuck) {
        const dx = (other.x + other.w / 2) - (prev.x + prev.w / 2);
        const dy = (other.y + other.h / 2) - (prev.y + prev.h / 2);
        bonds.push({ a: prev, b: other, rest: Math.hypot(dx, dy), stiff: true });
      }
      ball.stuck.push(other);
    }

    // a liquid paints any blank (white) square it touches (water = blue, lava = red)
    function paintBlank(liquid, o) {
      if (o.kind === "block" && o.color === "#ffffff") {
        o.color = (liquid.kind === "lava") ? LAVA_COLOR : WATER_COLOR;
      }
    }

    // water puts out fire, and when it hits fire or lava it hardens into a gray stone block
    function waterHitsFire(drop, other) {
      if (other.kind === "lava" || other.fire > 0) {
        if (other.fire > 0) other.fire = 0;            // extinguish the flames
        if (other.kind === "lava") other.dead = true;  // the lava is used up making the stone
        drop.kind = "block"; drop.emoji = null;        // the water hardens...
        drop.color = "#7f8c8d";                        // ...into gray stone
        drop.stone = true;                             // stone is fireproof — lava can't burn it
        drop.w = 18; drop.h = 18; drop.mass = 1;
        stats.stone++;
      }
    }

    // ===== JAKE'S COMBOS — add pairs here! "kindA+kindB" (alphabetical) -> result kind =====
    const COMBOS = { // simple 2-item recipes (aircraft PARTS use the assembler below instead)
      "jet+plane": "flyingplane",
      "helicopter+jet": "flyinghelicopter",
      "goat+soul": "soulgoat",
      "plane+propeller": "helicopter", // add a propeller to a built plane = helicopter
    };
    // a combo block ropes onto 2 things, then fuses them if they're a known recipe
    const AIRCRAFT_PARTS = ["jet", "seat", "tire", "landinggear", "propeller"];
    function isPart(k) { return AIRCRAFT_PARTS.indexOf(k) !== -1; }
    function ropeTo(combo, other) {
      const dx = (other.x + other.w / 2) - (combo.x + combo.w / 2);
      const dy = (other.y + other.h / 2) - (combo.y + combo.h / 2);
      bonds.push({ a: combo, b: other, rest: Math.hypot(dx, dy), stiff: true });
    }
    function comboStick(combo, other) {
      if (other.kind === "combo") return;
      if (other.kind === "water" || other.kind === "lava" || other.kind === "coladrop") return;
      if (combo.stuck.includes(other)) return;
      // ASSEMBLY MODE (started by roping a raw part): keep collecting 1 of each part, don't vanish
      const assembling = combo.stuck.length > 0 ? isPart(combo.stuck[0].kind) : isPart(other.kind);
      if (assembling) {
        if (!isPart(other.kind)) return; // only aircraft parts while assembling
        combo.stuck.push(other);
        ropeTo(combo, other);
        const have = {};
        for (const p of combo.stuck) have[p.kind] = (have[p.kind] || 0) + 1;
        if (have.jet && have.seat && have.tire && have.landinggear) { // a full aircraft!
          buildAircraft(combo, have.propeller ? "helicopter" : "plane");
        }
        return;
      }
      // NORMAL 2-item combos
      if (combo.stuck.length >= 2) return;
      combo.stuck.push(other);
      ropeTo(combo, other);
      if (combo.stuck.length === 2) tryCombine(combo);
    }
    function buildAircraft(combo, result) {
      let mx = 0, my = 0;
      for (const p of combo.stuck) { mx += p.x + p.w / 2; my += p.y + p.h / 2; p.dead = true; }
      mx /= combo.stuck.length; my /= combo.stuck.length;
      combo.dead = true;
      addObject(mx, my, result);
    }
    function tryCombine(combo) {
      const a = combo.stuck[0], b = combo.stuck[1];
      const key = [a.kind, b.kind].sort().join("+");
      const result = COMBOS[key];
      const mx = (a.x + a.w / 2 + b.x + b.w / 2) / 2;
      const my = (a.y + a.h / 2 + b.y + b.h / 2) / 2;
      if (result) {
        a.dead = true; b.dead = true; combo.dead = true; // ingredients + block are used up
        addObject(mx, my, result);
      } else {
        // not a recipe — just leave the two roped together and let the block fizzle
        bonds.push({ a: a, b: b, rest: Math.hypot((b.x + b.w / 2) - (a.x + a.w / 2), (b.y + b.h / 2) - (a.y + a.h / 2)), stiff: true });
        combo.dead = true;
      }
    }

    // lava sets things on fire; a burning thing puffs out rising flame triangles
    function ignite(o) {
      if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop" || o.stone || o.kind === "jet" || o.fireproof) return; // stone, jet & debris won't burn
      if (!o.fire) { o.fire = 60 + Math.floor(Math.random() * 300); stats.fires++; } // burns 1 to 6 seconds
    }
    function spawnFlame(o) {
      flames.push({
        x: o.x + o.w / 2 + (Math.random() - 0.5) * o.w,
        y: o.y + o.h / 2,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -1 - Math.random() * 1.5,                // always drifts upward
        size: 6 + Math.random() * 6,
        life: 60 + Math.floor(Math.random() * 300),  // each triangle lasts 1 to 6 seconds
        color: LAVA_DROP_COLORS[Math.floor(Math.random() * LAVA_DROP_COLORS.length)],
      });
    }
    function kaboom(x, y) { // a big fiery explosion at a point
      boom(x, y);
      for (let f = 0; f < 30; f++) {
        const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
        flames.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 8 + Math.random() * 8, life: 25 + Math.floor(Math.random() * 30), color: LAVA_DROP_COLORS[Math.floor(Math.random() * 3)] });
      }
    }
    function isAircraft(k) { return k === "plane" || k === "flyingplane" || k === "helicopter" || k === "flyinghelicopter"; }
    function spawnAircraftParts(x, y, kind) { // scatter fireproof parts (helicopters drop propellers, planes don't)
      const parts = ["tire", "tire", "jet", "seat", "landinggear"];
      if (kind === "helicopter" || kind === "flyinghelicopter") parts.push("propeller", "propeller");
      for (const p of parts) {
        addObject(x + (Math.random() - 0.5) * 24, y + (Math.random() - 0.5) * 24, p);
        const o = blocks[blocks.length - 1];
        const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 5;
        o.vx = Math.cos(a) * sp; o.vy = Math.sin(a) * sp - 3; o.spin = (Math.random() - 0.5) * 0.3;
      }
    }

    // draw a little red cola can
    function drawCan(w, h) {
      ctx.fillStyle = "#c8102e";
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-w / 2, -h * 0.08, w, h * 0.16); // white band
      ctx.fillStyle = "#9a0c22";
      ctx.fillRect(-w / 2, -h / 2, w, h * 0.1);      // darker top
    }

    // the entity grows a new limb (a 4-joint arm or leg) — pattern: arm, arm, leg, leg, repeat
    function addLimb(ent) {
      const order = ["arm", "arm", "leg", "leg", "arm", "arm", "leg", "leg"];
      const type = order[ent.limbs.length];
      let dir;
      if (type === "arm") {
        const armCount = ent.limbs.filter(l => l.type === "arm").length;
        const side = (armCount % 2 === 0) ? 1 : -1;
        dir = (side > 0 ? 0 : Math.PI) - 0.3; // reach sideways, angled a little up
      } else {
        const legCount = ent.limbs.filter(l => l.type === "leg").length;
        dir = Math.PI / 2 + (legCount - 1.5) * 0.35; // reach downward, spread out
      }
      ent.limbs.push({
        ax: Math.cos(dir) * ent.w / 2,
        ay: Math.sin(dir) * ent.h / 2,
        dir, type,
        len: (type === "leg" ? 20 : 16),
      });
    }

    // draw an entity's writhing limbs — 4 joints each, shifting to random spots every frame
    function drawEntityLimbs(ent) {
      const cx = ent.x + ent.w / 2, cy = ent.y + ent.h / 2;
      ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 4; ctx.lineCap = "round";
      for (const limb of ent.limbs) {
        let px = cx + limb.ax, py = cy + limb.ay, ang = limb.dir;
        ctx.beginPath();
        ctx.moveTo(px, py);
        for (let s = 0; s < 4; s++) { // 4 joints per limb
          ang += (Math.random() - 0.5) * 1.4; // always shift to a random position
          px += Math.cos(ang) * limb.len;
          py += Math.sin(ang) * limb.len;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }

    // draw the vacuum tool: a tank on the ground with a hose running up to the nozzle at your cursor
    function drawVacuum() {
      const tx = tankPos.x, ty = tankPos.y;
      const nx = mouse.x, ny = mouse.y;
      // hose first, so the tank and nozzle sit on top of it
      ctx.strokeStyle = "#7a7f88"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx, ty - 28);
      ctx.quadraticCurveTo((tx + nx) / 2, Math.max(ty, ny) + 50, nx, ny); // saggy hose
      ctx.stroke();
      // tank canister
      ctx.fillStyle = "#2b3a4a";
      ctx.fillRect(tx - 34, ty - 44, 68, 80);
      ctx.fillStyle = "#4a6076";
      ctx.fillRect(tx - 34, ty - 44, 68, 14);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "22px Arial"; ctx.fillText("🛢️", tx, ty - 4);
      ctx.font = "16px Arial"; ctx.fillText(tankTotal(), tx, ty + 22);
      // nozzle at the cursor
      ctx.fillStyle = "#cfd6dd";
      ctx.beginPath(); ctx.arc(nx, ny, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#555"; ctx.lineWidth = 3; ctx.stroke();
    }

    // ---- the tank stores COLORS now, and the needle injects them back out ----
    function injectColorFor(o) {
      if (o.kind === "cola") return "#ff4757";     // cola  -> red
      if (o.kind === "plane") return "#1e90ff";    // plane -> blue
      if (o.kind === "goat") return "#ffa502";     // goat  -> orange
      if (o.kind === "anvil") return "#7f8c8d";    // anvil -> gray
      if (o.kind === "coladrop") return "#5a3a1a"; // fizz  -> brown
      return o.color;                              // a normal cube keeps its own color
    }
    function addToTank(c) { tankColors[c] = (tankColors[c] || 0) + 1; }
    function tankTotal() { let s = 0; for (const c in tankColors) s += tankColors[c]; return s; }
    function availableColors() { return INJECT_ORDER.filter(c => tankColors[c] > 0); }
    function takeFromTank() {
      const av = availableColors();
      if (!av.length) return null;
      const c = av[0];
      if (--tankColors[c] <= 0) delete tankColors[c];
      return c;
    }
    function updateTankDisplay() { tankEl.textContent = "🛢️ Tank: " + tankTotal(); }

    // pop a little white square out of the top of the tank (shows the needle drew from it)
    function ejectTankSquare() {
      const tx = tankPos.x, ty = tankPos.y - 44;
      blocks.push({
        x: tx - 16, y: ty - 16, w: 32, h: 32,
        vx: (Math.random() - 0.5) * 4, vy: -8 - Math.random() * 4,
        angle: 0, spin: (Math.random() - 0.5) * 0.2,
        color: "#ffffff", mass: 1, kind: "block", emoji: null,
      });
    }

    // draw the needle tool: a syringe at the cursor, tubed to the tank, loaded with a picked color
    function drawNeedle() {
      const tx = tankPos.x, ty = tankPos.y, nx = mouse.x, ny = mouse.y;
      const av = availableColors();
      const c = av[selectedColorIdx] || null;
      // tube from tank to syringe
      ctx.strokeStyle = "#9aa3ad"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx, ty - 28);
      ctx.quadraticCurveTo((tx + nx) / 2, Math.max(ty, ny) + 50, nx, ny);
      ctx.stroke();
      // tank
      ctx.fillStyle = "#2b3a4a"; ctx.fillRect(tx - 34, ty - 44, 68, 80);
      ctx.fillStyle = "#4a6076"; ctx.fillRect(tx - 34, ty - 44, 68, 14);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "22px Arial"; ctx.fillText("🛢️", tx, ty - 4);
      ctx.font = "16px Arial"; ctx.fillText(tankTotal(), tx, ty + 22);
      // color choices with number labels (press the number to load that color)
      for (let i = 0; i < av.length; i++) {
        const sx = tx - 34 + i * 22, sy = ty - 74;
        ctx.fillStyle = av[i]; ctx.fillRect(sx, sy, 18, 18);
        if (i === selectedColorIdx) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(sx - 1, sy - 1, 20, 20); }
        ctx.fillStyle = "#fff"; ctx.font = "11px Arial"; ctx.fillText(i + 1, sx + 9, sy + 28);
      }
      // syringe at the cursor, tinted with the loaded color
      ctx.save();
      ctx.translate(nx, ny);
      ctx.fillStyle = c || "#cccccc";
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = "#dddddd"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, 24); ctx.stroke();
      ctx.restore();
    }

    // show which liquid the bucket is pouring
    function drawBucket() {
      const isLava = bucketLiquid === "lava";
      ctx.fillStyle = isLava ? LAVA_COLOR : WATER_COLOR;

    function openRadial(x, y) {

        }

              b.vx = 0; b.vy = 1.2; // helicopter: stop instantly, straight down at 2 blocks/sec (no forward/back)
            } else {
              b.vx = (b.vx >= 0 ? 1 : -1) * 3; b.vy = 0.6; // plane: keep gliding forward, sink ~1 block/sec
              b.angle = Math.atan2(b.vy, b.vx);
            }
            if (grounded) { b.landing = false; b.flying = false; b.vx = 0; b.vy = 0; }
          } else if (b.flying && (b.fuel || 0) > 0) { // powered flight after TAKEOFF while fueled
            b.fuel--;
            if (b.fuel <= 150) fuelBurning = true; // alarm once the bar is half-empty, until it lands/parks/runs dry
            b.vy -= GRAVITY;
            if (b.kind === "flyinghelicopter") {
              heliActive = true; // rotor sound while running
              if ((b.takingoff || 0) > 0) { b.takingoff--; b.vx = 0; b.vy = -1.2; } // rise straight up at 2 blocks/sec
              else { b.vy = 0; b.vx = (Math.abs(b.vx) < 0.1 ? 3 : (b.vx >= 0 ? 1 : -1) * 3); } // then hover level, drift sideways
            } else {
              jetPlaneActive = true; // jet hum only while a plane is running
              const sp = Math.hypot(b.vx, b.vy);
              if (sp > 0.1) { b.vx = b.vx / sp * 6; b.vy = b.vy / sp * 6; } else { b.vx = 6; }
              b.angle = Math.atan2(b.vy, b.vx); // planes bank into their heading
            }
            flames.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: -b.vx * 0.3, vy: -b.vy * 0.3, size: 5 + Math.random() * 4, life: 12 + Math.floor(Math.random() * 10), color: LAVA_DROP_COLORS[Math.floor(Math.random() * 3)] });
          } else if (b.flying) { // out of fuel — keep moving forward but glide down slowly, then land
            b.vy -= GRAVITY;
            b.vy = Math.min(0.6, b.vy + 0.02); // gentle ~1-block-per-second glide down
            b.vx *= 0.997;                      // keep most of its forward speed
            if (b.kind === "flyingplane") b.angle = Math.atan2(b.vy, b.vx);
            if (grounded) { b.flying = false; b.vx = 0; b.vy = 0; }
          }
        }
        if (b.kind === "soulgoat") { // charges & headbutts, panics, hops (toward other goats), bleats
          if (Math.random() < 0.003) playBleat(); // occasional bleat
          const feetY = b.y + b.h, gx = b.x + b.w / 2;
          if (b.charging) {
            // CHARGE: lunge fast and scream until it smacks something (or whiffs)
            goatCharging = true;
            b.vx = b.chargeDX * 9; b.vy = b.chargeDY * 9;
            b.chargeT = (b.chargeT || 0) + 1;
            let hit = null;
            for (const o of blocks) {
              if (o === b || o.kind === "soul" || o.kind === "goat" || o.kind === "soulgoat") continue;
              if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
              const d = Math.hypot((o.x + o.w / 2) - gx, (o.y + o.h / 2) - (b.y + b.h / 2));
              if (d < 42) { hit = o; break; }
            }
            const hitWall = (b.chargeDX < 0 && b.x <= 2) || (b.chargeDX > 0 && b.x + b.w >= W - 2);
            if (hit) { // SMACK — it goes flying, goat recoils a block back
              const rx = (hit.x + hit.w / 2) - gx, ry = (hit.y + hit.h / 2) - (b.y + b.h / 2), rd = Math.hypot(rx, ry) || 1;
              hit.vx += (rx / rd) * 20 / (hit.mass || 1);
              hit.vy += (ry / rd) * 20 / (hit.mass || 1) - 4;
              b.vx = -(rx / rd) * 5; b.vy = -3;
              b.charging = false; b.headbuttT = 60 + Math.floor(Math.random() * 3540);
            } else if (b.chargeT > 45 || hitWall) { // missed — reset and wait to try again
              b.charging = false; b.headbuttT = 60 + Math.floor(Math.random() * 3540);
            }
          } else {
            // eat a thing it's touching — never souls; never other goats unless cannibalism is on
            b.eatCD = (b.eatCD || 0) - 1;
            if (b.eatCD <= 0) {
              for (const o of blocks) {
                if (o === b || o.kind === "soul") continue;
                if ((o.kind === "goat" || o.kind === "soulgoat") && !cannibalism) continue;
                if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
                const d = Math.hypot((o.x + o.w / 2) - gx, (o.y + o.h / 2) - (b.y + b.h / 2));
                if (d < 34) { o.dead = true; b.eatCD = 30; if (Math.random() < 0.4) playBleat(); break; }
              }
            }
            // headbutt timer: every 1–60s, start a screaming charge at the nearest thing
            if (b.headbuttT === undefined) b.headbuttT = 60 + Math.floor(Math.random() * 3540);
            if (--b.headbuttT <= 0) {
              let target = null, td = 320;
              for (const o of blocks) {
                if (o === b || o.kind === "soul" || o.kind === "goat" || o.kind === "soulgoat") continue;
                if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
                const d = Math.hypot((o.x + o.w / 2) - gx, (o.y + o.h / 2) - (b.y + b.h / 2));
                if (d < td) { td = d; target = o; }
              }
              const dx = target ? (target.x + target.w / 2) - gx : (b.vx >= 0 ? 1 : -1);
              const dy = target ? (target.y + target.h / 2) - (b.y + b.h / 2) : 0;
              const dd = Math.hypot(dx, dy) || 1;
              b.chargeDX = dx / dd; b.chargeDY = dy / dd; b.charging = true; b.chargeT = 0;
            }
            // hopping (only while not charging)
            let grounded = feetY >= floor - 3;
            if (!grounded) {
              for (const o of blocks) {
                if (o === b || o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
                if (gx > o.x && gx < o.x + o.w && feetY >= o.y - 4 && feetY <= o.y + 10) { grounded = true; break; }
              }
            }
            if (grounded) {
              b.jumpT = (b.jumpT || 0) - 1;
              if (b.jumpT <= 0) {
                let threat = null, td = 240;
                for (const o of blocks) {
                  if (o === b || o.kind === "soul" || o.kind === "goat" || o.kind === "soulgoat") continue;
                  if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
                  const d = Math.hypot((o.x + o.w / 2) - gx, (o.y + o.h / 2) - (b.y + b.h / 2));
                  const scary = (o.y + o.h >= floor - 14 && Math.hypot(o.vx, o.vy) > 2.5) || d < 60;
                  if (scary && d < td) { td = d; threat = o; }
                }
                if (threat) { // SCARED — big hop away
                  const dir = gx - (threat.x + threat.w / 2) >= 0 ? 1 : -1;
                  b.vy = -4; b.vx = dir * (1.6 + Math.random() * 1.6); b.jumpT = 25;
                } else {
                  // calm — hop toward the nearest other goat if there is one, else a random little hop
                  let mate = null, md = 1e9;
                  for (const o of blocks) {
                    if (o === b || (o.kind !== "goat" && o.kind !== "soulgoat")) continue;
                    const d = Math.hypot((o.x + o.w / 2) - gx, (o.y + o.h / 2) - (b.y + b.h / 2));
                    if (d < md) { md = d; mate = o; }
                  }
                  const dir = mate ? ((mate.x + mate.w / 2) - gx >= 0 ? 1 : -1) : (Math.random() < 0.5 ? -1 : 1);
                  b.vy = -3; b.vx = dir * (0.5 + Math.random() * 0.8); b.jumpT = 60;
                }
              }
            }
          }
        }
        if (b.kind === "soul") { // souls float like little ghosts (no gravity, gentle drift)
          b.vy -= GRAVITY + 0.02;
          b.vx += (Math.random() - 0.5) * 0.2;
          b.vy += (Math.random() - 0.5) * 0.2;
          b.vx *= 0.96; b.vy *= 0.96;
        }
        if (b.kind === "dave" && b.egg) { // still an egg — sit tight, then hatch into a SMALL Dave
          b.vx = 0; b.spin = 0; b.angle = 0;
          if (--b.eggT <= 0) {
            b.egg = false;
            spawnHatch(b);
            const cx = b.x + b.w / 2, bottom = b.y + b.h;
            b.baseW = 68; b.baseH = 28; b.scale = 0.5; b.eaten = 0; // hatch at half size; eat 4 squares to reach full
            b.w = b.baseW * b.scale; b.h = b.baseH * b.scale;
            b.x = cx - b.w / 2; b.y = bottom - b.h;
          }
        }
        if (b.kind === "dave" && !b.egg) { // walks the ground; turns at walls/bumps; floats at edges (like Roblox)
          if (b.dir === undefined) b.dir = 1;
          const cx = b.x + b.w / 2, feetY = b.y + b.h;
          if (b.x <= 0) b.dir = 1;              // left wall -> go right
          if (b.x + b.w >= W) b.dir = -1;       // right wall -> go left
          let fell = false;
          for (const o of blocks) {             // bumped into something?
            if (o === b) continue;
            if (o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
            if (b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y) {
              if ((b.scale || 1) < 1 && o.kind === "block" && !o.dead) { // small Dave EATS squares instantly and grows
                o.dead = true; b.eaten = (b.eaten || 0) + 1; growDave(b);
                continue;
              }
              if (b.floating) { b.floating = false; fell = true; }   // hit while floating -> he drops
              else {
                const ocx = o.x + o.w / 2;                           // grounded -> head opposite of what he hit
                if ((b.dir > 0 && ocx > cx) || (b.dir < 0 && ocx < cx)) b.dir = ocx > cx ? -1 : 1;
              }
            }
          }
          // is there solid ground under his feet? (ignores himself AND other Daves — Daves aren't ground)
          const groundAt = (px) => {
            if (feetY >= floor - 3) return true; // the world floor
            for (const o of blocks) {
              if (o === b || o.kind === "dave" || o.kind === "water" || o.kind === "lava" || o.kind === "coladrop") continue;
              if (px > o.x && px < o.x + o.w && feetY >= o.y - 6 && feetY <= o.y + 14) return true;
            }
            return false;
          };
          const onGround = groundAt(cx);
          const aheadX = b.dir > 0 ? b.x + b.w + 4 : b.x - 4;
          if (onGround && !groundAt(aheadX)) b.dir = -b.dir;              // reached a real ledge -> switch directions
          if (!fell && !onGround && b.wasGrounded && Math.abs(b.vy) < 2.5) b.floating = true; // stepped off solid ground -> start floating
          if (onGround) b.floating = false;
          if (b.floating && Math.abs(b.vy) < 2.5) b.vy = 0;              // hover; never from spawning in air or standing on another Dave
          b.wasGrounded = onGround;
          b.vx = b.dir * 1.8;
          b.spin = 0; b.angle = 0; // stays upright
        }
        b.x += b.vx;
        b.y += b.vy;
        b.angle += b.spin;

        // floor
        if (b.y + b.h > floor) { b.y = floor - b.h; b.vy *= -0.5; b.vx *= 0.8; b.spin *= 0.8; }
        // ceiling — bounce off the top so nothing flies off into space
        if (b.y < 0) { b.y = 0; b.vy *= -0.5; }
        // walls
        if (b.x < 0) { b.x = 0; b.vx *= -0.6; }
        if (b.x + b.w > W) { b.x = W - b.w; b.vx *= -0.6; }
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > maxSpeed) maxSpeed = sp;
        if (b.fire > 0) { b.fire--; if (b.fire % 5 === 0) spawnFlame(b); if (b.fire === 0) b.dead = true; } // burns up, then vanishes
        if (b.kind === "entity" && b.activated) {
          b.growTimer++;
          if (b.growTimer % 60 === 0 && b.limbs.length < 8) addLimb(b); // grow a limb each second
          const ecx = b.x + b.w / 2, ecy = b.y + b.h / 2;
          // walk along the ground toward the nearest thing to hunt it down
          {
            let tx = null, td = Infinity;
            for (const o of blocks) {
              if (o === b || o.dead || o.captured) continue;
              if (o.kind === "entity" && !cannibalism) continue; // don't hunt other entities unless cannibalism is on
              const dd = Math.hypot((o.x + o.w / 2) - ecx, (o.y + o.h / 2) - ecy);
              if (dd < td) { td = dd; tx = o.x + o.w / 2; }
            }
            const grounded = (b.y + b.h) >= floor - 6;
            if (grounded && tx !== null) {
              const dir = Math.sign(tx - ecx);
              b.vx += dir * 0.4;
              if (b.vx > ENTITY_SPEED) b.vx = ENTITY_SPEED;
              if (b.vx < -ENTITY_SPEED) b.vx = -ENTITY_SPEED;
              b.walkPhase = (b.walkPhase || 0) + 1;
              if (b.walkPhase % 24 === 0) b.vy -= 2.2; // a little stepping hop
            }
          }
          if (!b.eating) b.eating = [];
          // animate every block it's currently eating (up to 4 at once)
          for (const bite of b.eating) {
            const prey = bite.prey;
            if (!prey || prey.dead) { bite.done = true; continue; }
            const t = ++bite.timer;
            const ox = (bite.slot - 1.5) * 26; // spread the 4 held blocks apart
            if (t <= 60) {
              // hold it up above the body for a second
              const k = t / 60, hx = ecx + ox, hy = ecy - b.h - 44;
              prey.x = (bite.fromX + (hx - bite.fromX) * k) - prey.w / 2;
              prey.y = (bite.fromY + (hy - bite.fromY) * k) - prey.h / 2;
              prey.angle = 0;
            } else if (t <= 90) {
              // bring it down to the mouth
              const k = (t - 60) / 30, fromY = ecy - b.h - 44;
              prey.x = (ecx + ox * (1 - k)) - prey.w / 2;
              prey.y = (fromY + (ecy - fromY) * k) - prey.h / 2;
            } else if (t <= 150) {
              // bob it up and down at the mouth for a second (chewing)
              prey.x = (ecx + ox * 0.3) - prey.w / 2;
              prey.y = (ecy + Math.sin((t - 90) * 0.8 + bite.slot) * 8) - prey.h / 2;
              prey.angle = Math.sin((t - 90) * 1.6) * 0.3;
            } else {
              // gulp — what it ate disappears
              prey.dead = true; bite.done = true; stats.eaten++;
            }
          }
          b.eating = b.eating.filter(bite => !bite.done);
          // grab new blocks to fill up to 4 hands
          if (b.limbs.length > 0 && b.eating.length < 4) {
            b.eatCooldown = (b.eatCooldown || 0) - 1;
            if (b.eatCooldown <= 0) {
              const reach = 50 + b.limbs.length * 8; // the more limbs, the farther it reaches
              const near = [];
              for (const o of blocks) {
                if (o === b || o.dead || o.captured) continue;
                if (o.kind === "entity" && !cannibalism) continue; // only eat other entities if cannibalism is on
                const d = Math.hypot((o.x + o.w / 2) - ecx, (o.y + o.h / 2) - ecy);
                if (d < reach) near.push({ o, d });
              }
              near.sort((p, q) => p.d - q.d);
              const need = 4 - b.eating.length;
              for (let i = 0; i < Math.min(need, near.length); i++) {
                const prey = near[i].o;
                prey.captured = true; prey.capturedBy = b;
                b.eating.push({ prey, timer: 0, slot: b.eating.length, fromX: prey.x + prey.w / 2, fromY: prey.y + prey.h / 2 });
              }
              b.eatCooldown = 8;
            }
          }
        }
      }

      // cola cans burst when they get tipped far enough over
      const cans = blocks.filter(b => b.kind === "cola" && !b.popped);
      for (const can of cans) {
        let a = can.angle % (Math.PI * 2); if (a < 0) a += Math.PI * 2;
        const tilt = Math.min(a, Math.PI * 2 - a); // 0 = standing up, bigger = more tipped over

      }

      // springy glue: pull bonded blocks back together — unless stretched too far, then SNAP
      const survivors = [];
      let broke = 0;
      for (const bond of bonds) {
        const a = bond.a, b = bond.b;
        const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
        const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
        const dist = Math.hypot(dx, dy) || 0.001;
        if (dist > BREAK_DISTANCE) { broke++; continue; } // SNAP! this bond breaks and the block flies free
        const nx = dx / dist, ny = dy / dist;
        const strength = bond.stiff ? 1 : STICK_STRENGTH; // cola welds are rock-solid
        const correction = (dist - bond.rest) * 0.5 * strength;
        a.x += nx * correction; a.y += ny * correction;
        b.x -= nx * correction; b.y -= ny * correction;
        survivors.push(bond);
      }
      bonds = survivors;
      if (broke > 0) playSnap(); // play one crack sound when glue breaks

      // blocks bump into each other — treat each block like a circle
      let popsThisFrame = 0;
      for (let i = 0; i < blocks.length; i++) {
        for (let j = i + 1; j < blocks.length; j++) {
          const a = blocks[i], b = blocks[j];
          if (a.captured || b.captured) continue; // stuff being eaten doesn't collide
          const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
          const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
          const dist = Math.hypot(dx, dy);
          const minDist = a.w / 2 + b.w / 2;
          if (dist > 0 && dist < minDist) {
            const nx = dx / dist, ny = dy / dist;
            const overlap = minDist - dist;
            const totalMass = a.mass + b.mass;
            // shove them apart — the heavier one moves less
            a.x -= nx * overlap * (b.mass / totalMass); a.y -= ny * overlap * (b.mass / totalMass);
            b.x += nx * overlap * (a.mass / totalMass); b.y += ny * overlap * (a.mass / totalMass);
            const avn = a.vx * nx + a.vy * ny;
            const bvn = b.vx * nx + b.vy * ny;
            const vn = avn - bvn; // how fast they're closing in on each other
            if (vn > 0) {
              const j = (1 + BOUNCINESS) * vn / (1 / a.mass + 1 / b.mass); // bounce force, shared by weight
              a.vx -= (j / a.mass) * nx; a.vy -= (j / a.mass) * ny;
              b.vx += (j / b.mass) * nx; b.vy += (j / b.mass) * ny;
              // only pop on a HARD hit, and never more than MAX_POPS at once
              if (vn > POP_THRESHOLD && popsThisFrame < MAX_POPS) { playPop(vn); popsThisFrame++; }
            }

            if (a.kind === "coladrop") stickTo(a, b);
            else if (b.kind === "coladrop") stickTo(b, a);
            // combo block ropes onto what it touches (fuses 2 into a combo)
            if (a.kind === "combo") comboStick(a, b);
            else if (b.kind === "combo") comboStick(b, a);
            // aircraft blow up when they touch each other or hit a bird (and scatter parts)
            const aAir = isAircraft(a.kind), bAir = isAircraft(b.kind);
            if ((aAir && bAir) || (aAir && b.kind === "bird") || (bAir && a.kind === "bird")) {
              const cx = (a.x + a.w / 2 + b.x + b.w / 2) / 2, cy = (a.y + a.h / 2 + b.y + b.h / 2) / 2;
              kaboom(cx, cy);
              if (aAir) spawnAircraftParts(cx, cy, a.kind);
              if (bAir) spawnAircraftParts(cx, cy, b.kind);
              a.dead = true; b.dead = true;
            }
            // water and lava paint any blank white square they touch
            if (a.kind === "water" || a.kind === "lava") paintBlank(a, b);
            else if (b.kind === "water" || b.kind === "lava") paintBlank(b, a);
            // water puts out fire / lava and turns to gray stone
            if (a.kind === "water") waterHitsFire(a, b);
            else if (b.kind === "water") waterHitsFire(b, a);
            // a sponge soaks up (deletes) any liquid it touches
            if (a.kind === "sponge" && (b.kind === "water" || b.kind === "lava" || b.kind === "coladrop")) b.dead = true;
            else if (b.kind === "sponge" && (a.kind === "water" || a.kind === "lava" || a.kind === "coladrop")) a.dead = true;
            // lava sets whatever it touches on fire
            if (a.kind === "lava") ignite(b);
            else if (b.kind === "lava") ignite(a);
            // the entity wakes up when anything touches it
            if (a.kind === "entity") a.activated = true;
            if (b.kind === "entity") b.activated = true;
            // a soul brings a plain goat to life — turns it into a soul-goat
            if (a.kind === "soul" && b.kind === "goat") { b.kind = "soulgoat"; a.dead = true; }
            else if (b.kind === "soul" && a.kind === "goat") { a.kind = "soulgoat"; b.dead = true; }
          }
        }
      }

      // if you're holding a block, drag it to follow your mouse (and fling it on release)
      if (held) {
        const nx = mouse.x - held.w / 2;
        const ny = mouse.y - held.h / 2;
        held.vx = nx - held.x;
        held.vy = ny - held.y;
        held.x = nx; held.y = ny;
      }

      // gravity gun: if you're carrying one, its beam grabs and moves an object
      if (held && held.kind === "gravgun") {
        const gun = held;
        gun.angle = gun.aim; // point the gun where it's aimed
        const gx = gun.x + gun.w / 2, gy = gun.y + gun.h / 2;
        if (rightDown) {
          if (!gun.beamHold || gun.beamHold.dead) {
            let best = null, bd = 500;
            for (const o of blocks) {
              if (o === gun || o.dead || o.captured) continue;
              const dx = (o.x + o.w / 2) - gx, dy = (o.y + o.h / 2) - gy;
              const dot = dx * Math.cos(gun.aim) + dy * Math.sin(gun.aim); // is it in front of the gun?
              const dist = Math.hypot(dx, dy);
              if (dot > 0 && dist < bd) { bd = dist; best = o; }
            }
            if (best) { gun.beamHold = best; best.captured = true; best.capturedBy = gun; }
          }
          if (gun.beamHold) {
            const t = gun.beamHold;
            const tx = gx + Math.cos(gun.aim) * gun.beamDist;
            const ty = gy + Math.sin(gun.aim) * gun.beamDist;
            const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
            t.vx = tx - cx; t.vy = ty - cy; // give it velocity so it punts when released
            t.x = tx - t.w / 2; t.y = ty - t.h / 2;
          }
        } else if (gun.beamHold) {
