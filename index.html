          gun.beamHold = null;
        }
      }

      // jet engine: right-click sucks in blocks and burns them into a jet of fire
      if (held && held.kind === "jet") {
        const jet = held;
        jet.angle = jet.aim;
        const ex = jet.x + jet.w / 2, ey = jet.y + jet.h / 2;
        if (rightDown) {
          for (const o of blocks) { // intake: pull nearby solids in and swallow them as fuel
            if (o === jet || o.dead || o.captured) continue;
            if (o.kind === "lava" || o.kind === "coladrop") continue; // water CAN go in — it's the boost, not fuel
            const dx = ex - (o.x + o.w / 2), dy = ey - (o.y + o.h / 2);
            const d = Math.hypot(dx, dy) || 0.001;
            if (d < 200) {
              o.vx += (dx / d) * 2; o.vy += (dy / d) * 2;
              if (d < 26) {
                if (o.kind === "bird") { // a bird in the intake blows the whole engine up!
                  o.dead = true; boom(ex, ey);
                  for (let f = 0; f < 30; f++) {
                    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
                    flames.push({ x: ex, y: ey, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 8 + Math.random() * 8, life: 25 + Math.floor(Math.random() * 30), color: LAVA_DROP_COLORS[Math.floor(Math.random() * 3)] });
                  }
                  for (const p of blocks) { if (p !== jet && !p.dead) { const dd = Math.hypot((p.x + p.w / 2) - ex, (p.y + p.h / 2) - ey); if (dd < 140) ignite(p); } }
                  jet.dead = true; held = null; // the engine is destroyed
                  break;
                }
                o.dead = true;
                if (o.kind === "water") jet.boost = (jet.boost || 0) + 30; // water = nitrous boost (useless without fuel)
                else jet.fuel = (jet.fuel || 0) + 25; // solid blocks = fuel
              }
            }
          }
          if (jet.fuel > 0 && !jet.dead) { // exhaust: shoot fire out the front, PUSH + ignite what's in the way
            jet.fuel--;
            const boosted = (jet.boost || 0) > 0; // water boost = bigger, hotter, farther fire
            if (boosted) jet.boost--;
            const range = boosted ? 260 : 170;
            const puffs = boosted ? 5 : 2;
            const pushMul = boosted ? 2.2 : 1;
            const fx = ex + Math.cos(jet.aim) * jet.w * 0.6, fy = ey + Math.sin(jet.aim) * jet.w * 0.6;
            for (let k = 0; k < puffs; k++) {
              const spread = (Math.random() - 0.5) * 0.5, sp = (boosted ? 8 : 5) + Math.random() * 4;
              flames.push({
                x: fx, y: fy,
                vx: Math.cos(jet.aim + spread) * sp, vy: Math.sin(jet.aim + spread) * sp,
                size: (boosted ? 11 : 7) + Math.random() * 6, life: 20 + Math.floor(Math.random() * 25),
                color: LAVA_DROP_COLORS[Math.floor(Math.random() * LAVA_DROP_COLORS.length)],
              });
            }
            for (const o of blocks) {
              if (o === jet || o.dead) continue;
              const dx = (o.x + o.w / 2) - fx, dy = (o.y + o.h / 2) - fy;
              const dist = Math.hypot(dx, dy) || 0.001;
              if (dist < range && (dx * Math.cos(jet.aim) + dy * Math.sin(jet.aim)) / dist > 0.5) {
                ignite(o);
                const force = 5 * (1 - dist / range) / (o.mass || 1) * pushMul; // boost = way stronger shove
                o.vx += Math.cos(jet.aim) * force; o.vy += Math.sin(jet.aim) * force;
              }
            }
          }
        }
      }

      // bucket: while held, pour out water (blue) or lava (orange/yellow/red) droplets
      if (mode === "bucket" && pointerDown) {
        const isLava = bucketLiquid === "lava";
        for (let k = 0; k < 3; k++) {
          const ang = Math.PI / 2 + (Math.random() - 0.5) * 1.0; // pour downward-ish
          const spd = 1 + Math.random() * 3;
          const col = isLava ? LAVA_DROP_COLORS[Math.floor(Math.random() * LAVA_DROP_COLORS.length)] : WATER_COLOR;
          blocks.push({
            x: mouse.x - 6, y: mouse.y - 6, w: 12, h: 12,
            vx: Math.cos(ang) * spd + (Math.random() - 0.5) * 2, vy: Math.sin(ang) * spd,
            angle: 0, spin: 0, color: col, mass: 0.3,
            emoji: null, kind: isLava ? "lava" : "water", // liquids stay until a vacuum or sponge removes them
          });
        }
      }

      // vacuum: while held, suck nearby stuff toward the nozzle and swallow the close ones
      if (mode === "vacuum" && pointerDown) {
        for (const b of blocks) {
          const dx = mouse.x - (b.x + b.w / 2);
          const dy = mouse.y - (b.y + b.h / 2);
          const d = Math.hypot(dx, dy) || 0.001;
          if (d < VACUUM_RANGE) {
            b.vx += (dx / d) * VACUUM_POWER + (-dy / d) * VACUUM_SWIRL; // pull it in AND swirl it around
            b.vy += (dy / d) * VACUUM_POWER + (dx / d) * VACUUM_SWIRL;
            if (d < 22) {
              if (b.kind === "entity") {
                // the vacuum can't swallow the entity — it strips his power, turning him into a normal block!
                for (const bite of (b.eating || [])) { if (bite.prey) { bite.prey.captured = false; bite.prey.capturedBy = null; } }
                b.kind = "block"; b.emoji = null;
                b.color = colors[Math.floor(Math.random() * colors.length)];
                b.limbs = []; b.activated = false; b.eating = [];
                stats.defeated++;
              } else {
                b.dead = true; addToTank(injectColorFor(b)); stats.vacuumed++; // swallowed — bank its color!
              }
            }
          }
        }
        updateTankDisplay();
      }

      // right-click blows blocks back OUT of the tank, like a leaf blower
      if (mode === "vacuum" && rightDown && tankTotal() > 0) {
        const tx = tankPos.x, ty = tankPos.y;
        let dx = mouse.x - tx, dy = mouse.y - ty; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
        const shots = Math.min(tankTotal(), 3); // blow a few out per frame
        for (let k = 0; k < shots; k++) {
          const c = takeFromTank(); if (!c) break;
          const a = (Math.random() - 0.5) * 0.5;              // a little spread
          const vx = dx * Math.cos(a) - dy * Math.sin(a);
          const vy = dx * Math.sin(a) + dy * Math.cos(a);
          const spd = 9 + Math.random() * 6;
          blocks.push({
            x: mouse.x - 18, y: mouse.y - 18, w: 36, h: 36,
            vx: vx * spd, vy: vy * spd, angle: 0, spin: (Math.random() - 0.5) * 0.3,
            color: c, mass: 1, kind: "block", emoji: null,
          });
        }
        updateTankDisplay();
      }

      // age the cola drops and water droplets so they fade after their time is up
      for (const b of blocks) {
        if (b.life !== undefined && --b.life <= 0) b.dead = true;
      }

      // release captured things whose captor is gone or no longer holding them
      for (const b of blocks) {
        if (!b.captured) continue;
        const cap = b.capturedBy;
        if (!cap || cap.dead) { b.captured = false; b.capturedBy = null; }
        else if (cap.kind === "gravgun" && (held !== cap || !rightDown)) { b.captured = false; b.capturedBy = null; }
      }

      // remove everything that got swallowed or faded away (and any glue it made)
      if (blocks.some(b => b.dead)) {
        for (const b of blocks) if (b.dead && b.kind === "block") stats.destroyed++; // count cleared blocks
        bonds = bonds.filter(bd => !bd.a.dead && !bd.b.dead);
        blocks = blocks.filter(b => !b.dead);
      }

      // move the fire triangles upward and clear out old ones
      for (const f of flames) { f.x += f.vx; f.y += f.vy; f.life--; }
      flames = flames.filter(f => f.life > 0);

      // hatch bits: pop up, then gravity pulls them down THROUGH the floor and off-screen
      for (const p of bits) { p.vy += GRAVITY; p.x += p.vx; p.y += p.vy; p.rot += p.spin || 0; }
      bits = bits.filter(p => p.y < H + 40);

      updateScream(maxSpeed); // SCREAM when things are flying fast!
      updateJetDrone(jetPlaneActive); // flying planes hum like jet engines
      updateGoatScream(goatCharging); // a goat screams while it charges
      updateHeliSound(heliActive); // choppers whop-whop
      updateFuelAlarm(fuelBurning); // woop-woop while burning fuel
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.9; if (shake < 0.5) shake = 0; }

      // ground line
      ctx.fillStyle = "#2c3e50";
      ctx.fillRect(0, H - 20, W, 20);

      // draw the glue lines so you can watch them snap
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 3;
      for (const bond of bonds) {
        ctx.beginPath();
        ctx.moveTo(bond.a.x + bond.a.w / 2, bond.a.y + bond.a.h / 2);
        ctx.lineTo(bond.b.x + bond.b.w / 2, bond.b.y + bond.b.h / 2);
        ctx.stroke();
      }

      // the entity's writhing limbs (drawn behind the bodies)
      for (const b of blocks) {
        if (b.kind === "entity" && b.activated) drawEntityLimbs(b);
      }

      for (const b of blocks) {
        ctx.save();
        ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
        ctx.rotate(b.angle);
        if (b.emoji) {
          ctx.font = b.w + "px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(b.emoji, 0, 0);
        } else if (b.kind === "anvil") {
          drawAnvil(b.w, b.h);
        } else if (b.kind === "cola") {
          drawCan(b.w, b.h);
        } else if (b.kind === "coladrop" || b.kind === "water" || b.kind === "lava") {
          ctx.fillStyle = b.color;
          ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, Math.PI * 2); ctx.fill();
        } else if (b.kind === "entity") {
          ctx.fillStyle = "#000000";
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.strokeStyle = "#444444"; ctx.lineWidth = 2; ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
        } else if (b.kind === "gravgun") {
          ctx.fillStyle = "#5a5f66";                            // gray body
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w * 0.7, b.h);
          ctx.fillStyle = "#ff8a00";                            // orange prongs at the front
          ctx.fillRect(b.w * 0.12, -b.h / 2, b.w * 0.32, b.h * 0.28);
          ctx.fillRect(b.w * 0.12, b.h / 2 - b.h * 0.28, b.w * 0.32, b.h * 0.28);
          ctx.fillStyle = "#ffd24a";                            // glowing core
          ctx.beginPath(); ctx.arc(b.w * 0.05, 0, 5, 0, Math.PI * 2); ctx.fill();
        } else if (b.kind === "jet") {
          ctx.fillStyle = "#6b7280"; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);        // engine body
          ctx.fillStyle = "#3a4048"; ctx.fillRect(-b.w / 2, -b.h / 2, b.w * 0.25, b.h);  // intake at the back
          ctx.fillStyle = "#ff8a00"; ctx.beginPath(); ctx.arc(b.w * 0.42, 0, b.h * 0.35, 0, Math.PI * 2); ctx.fill(); // exhaust glow at the front
        } else if (b.kind === "tire") {
          ctx.fillStyle = "#1c1c1c"; ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#777"; ctx.beginPath(); ctx.arc(0, 0, b.w / 4, 0, Math.PI * 2); ctx.fill();
        } else if (b.kind === "propeller") {
          ctx.fillStyle = "#999"; ctx.fillRect(-b.w / 2, -3, b.w, 6); ctx.fillRect(-3, -b.w / 2, 6, b.w);
        } else if (b.kind === "dave" && b.egg) {
          // a chunky PIXELATED egg (narrow top, round bottom)
          const EGG = ["  11  ", " 1111 ", " 1111 ", "111111", "111111", "111111", "111111", " 1111 "];
          const cols = 6, rows = EGG.length;
          const px = Math.min(b.w / cols, b.h / rows);
          const ox = -px * cols / 2, oy = -px * rows / 2;
          ctx.fillStyle = b.color;
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (EGG[r][c] === "1") ctx.fillRect(ox + c * px, oy + r * px, px, px);
          ctx.fillStyle = "rgba(255,255,255,0.35)"; // a couple of shine pixels
          ctx.fillRect(ox + px, oy + px * 2, px, px); ctx.fillRect(ox + px * 2, oy + px, px, px);
        } else if (b.kind === "dave") {
          ctx.fillStyle = b.color; // green, or a rare red/yellow/blue/grey Dave
          const front = b.h, backW = b.h * 1.3, backH = b.h * 0.78, bottom = b.h / 2;
          const dir = b.dir || 1;
          const frontX = dir >= 0 ? (b.w / 2 - front) : (-b.w / 2);   // front square leads the way
          const backX  = dir >= 0 ? (-b.w / 2) : (b.w / 2 - backW);   // back rectangle trails behind
          ctx.fillRect(frontX, bottom - front, front, front);          // front square
          ctx.fillRect(backX, bottom - backH, backW, backH);           // back rectangle (a little shorter)
        } else {
          ctx.fillStyle = b.color;
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        }
        ctx.restore();
      }

      // fuel bars above flying aircraft (shown while fuel is 1+, gone at 0)
      for (const b of blocks) {
        if ((b.kind === "flyingplane" || b.kind === "flyinghelicopter") && (b.fuel || 0) > 0) {
          ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(b.x, b.y - 10, b.w, 5);
          ctx.fillStyle = "#2ed573"; ctx.fillRect(b.x, b.y - 10, b.w * Math.min(1, b.fuel / 300), 5);
        }
      }

      // draw the fire triangles (always pointing up)
      for (const f of flames) {
        ctx.globalAlpha = Math.min(1, f.life / 30);
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.moveTo(f.x, f.y - f.size);
        ctx.lineTo(f.x - f.size / 2, f.y);
        ctx.lineTo(f.x + f.size / 2, f.y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // hatch bits — tiny squares, triangles & circles tumbling down through the screen
      for (const p of bits) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        const s = p.size;
        if (p.shape === "circle") {
          ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill();
        } else if (p.shape === "triangle") {
          ctx.beginPath(); ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); ctx.fill();
        } else {
          ctx.fillRect(-s / 2, -s / 2, s, s);
        }
        ctx.restore();
      }

      // gravity gun beam
      if (held && held.kind === "gravgun" && held.beamHold) {
        const gx = held.x + held.w / 2, gy = held.y + held.h / 2;
        const t = held.beamHold;
        ctx.strokeStyle = "rgba(255,170,50,0.85)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(t.x + t.w / 2, t.y + t.h / 2); ctx.stroke();
      }

      ctx.restore();

      if (mode === "vacuum") drawVacuum();
      else if (mode === "needle") drawNeedle();
      else if (mode === "bucket") drawBucket();
      if (radialOpen) drawRadial();
      if (paused) {
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff"; ctx.font = "bold 46px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("⏸ PAUSED", W / 2, H / 2);
      }
    }

    function loop() { if (!paused) { update(); updateQuests(); } draw(); requestAnimationFrame(loop); }
    newLevel();
    loop();
  </script>
</body>
</html>
